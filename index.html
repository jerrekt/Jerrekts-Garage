<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jerrekt's Garage</title><style>
:root{--bg:#0f1115;--card:#171a21;--line:#2a2f3a;--fg:#e8eaf0;--mute:#9aa3b2;--ok:#4caf7d;--due:#e0a640;--over:#e05a4f;--accent:#5b9cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px}
h1{font-size:28px;margin:0 0 4px}h2{font-size:18px;margin:28px 0 10px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--mute);margin:0 0 20px}
.cars{display:flex;gap:10px;flex-wrap:wrap}.car{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer}
.car.active{border-color:var(--accent)}.car small{display:block;color:var(--mute)}
.car.soon{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.tile b{display:block}.tile span{display:block;color:var(--mute);font-size:14px}
.tile.ok{border-left:4px solid var(--ok)}.tile.due{border-left:4px solid var(--due)}.tile.over{border-left:4px solid var(--over)}
.odo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;width:130px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{color:var(--mute);font-weight:500;font-size:14px}td.m{white-space:nowrap;color:var(--mute)}
.flag{font-size:13px;color:var(--due)}
@media(max-width:480px){td.d{display:none}th.d{display:none}}

.cars{display:flex;gap:10px;margin-bottom:12px}.car{border:1px solid;border-radius:10px;padding:8px 14px;opacity:.5}.car.on{opacity:1}
svg{width:100%;height:auto;display:block}.t{font-weight:600;font-size:15px}.s{font-size:12px;opacity:.75}.hint{font-size:13px;opacity:.6;margin-top:10px}
body{background:#0f1115;color:#e8eaf0}.car{border-color:#2a2f3a}.car.on{border-color:#5b9cff}
.stage{background:linear-gradient(#171a21,#101318);border:1px solid #2a2f3a;border-radius:14px;padding:10px}
.pillar,.seam{stroke:#7d838c;stroke-width:2;fill:none}.spoke{stroke:#777;stroke-width:3}.ld{stroke:#5b9cff;stroke-width:1.5}.pt{fill:#5b9cff}
.box rect{fill:#1c2130;stroke:#5b9cff;stroke-width:1.2}.box text{fill:#e8eaf0}.box{cursor:pointer}

.stage{margin-bottom:8px}.box.sel rect{fill:#2a3f6b}.car{opacity:.5}.car.on{opacity:1;border-color:var(--accent)}.hint{font-size:13px;color:var(--mute)}.body{fill:#9a9ea4}.lower{fill:#1b1e24}.shade{fill:#7f848b}.glass{fill:#232a36}.kink{fill:#9a9ea4}.pillar{stroke:#6b7079;stroke-width:3;fill:none}
.seam{stroke:#777c85;stroke-width:2;fill:none}.handle{fill:#6b7079}.mirror{fill:#8a8e95}.trim{fill:#15181d}.tail{fill:#b3302c}.lamp{fill:#eef0e6}.grille{fill:#15181d}
.tire{fill:#15181d}.rimouter{fill:#c7c9cc}.rimface{fill:#2a2d33}.spoke{fill:#d6d8db}.hub{fill:#9a9ea4}
</style></head><body><main>

<p class="hint">Click a system box to filter the history. Click again to clear.</p>
<h2>Maintenance due</h2>
<div class="odo"><label>Odometer <input id="odo" type="number" step="100"></label><span id="odonote" class="flag"></span></div>
<div class="grid" id="due" style="margin-top:12px"></div>
<p class="flag" id="intflag"></p>
<h2>Service history</h2>
<table><thead><tr><th class="d">Date</th><th>Miles</th><th>Work</th></tr></thead><tbody id="hist"></tbody></table>
</main>
<script>
fetch('data/e36-m3.json').then(r=>r.json()).then(car=>{
const odo=document.getElementById('odo'),note=document.getElementById('odonote');
const last=Math.max(...car.history.map(h=>h.miles||0));
odo.value=car.odometer||last; note.textContent=car.odometer?'':car.odometer_note;
const fmt=m=>m==null?'':(m/1000).toFixed(1)+'k';
document.getElementById('hist').innerHTML=[...car.history].reverse().map(h=>`<tr><td class="d m">${h.date||'—'}</td><td class="m">${fmt(h.miles)}</td><td>${h.work.join(', ')}</td></tr>`).join('');
function render(){const now=+odo.value||last;document.getElementById('due').innerHTML=car.intervals.map(i=>{
 const done=car.history.filter(h=>h.miles&&h.work.some(w=>w.toLowerCase().includes(i.match)));
 const lastAt=done.length?Math.max(...done.map(h=>h.miles)):null;
 const next=lastAt==null?null:lastAt+i.miles;const left=next==null?null:next-now;
 const cls=left==null?'':left<0?'over':left<i.miles*0.15?'due':'ok';
 const txt=left==null?'no record':left<0?`overdue by ${fmt(-left)}`:`${fmt(left)} left`;
 return `<div class="tile ${cls}"><b>${i.item}</b><span>every ${fmt(i.miles)} · last ${fmt(lastAt)||'—'}</span><span>${txt}</span></div>`}).join('')}
odo.oninput=render;render();
let sel=null;const cats={Engine:['valve cover','spark','idle','oil change','oil pan','camshaft','manifold','throttle','pulley','air filter'],Cooling:['radiator','hose','fan','coolant'],Drivetrain:['diff'],Suspension:['coilover','sway','tie rod','ball joint','bushing','camber','alignment'],Steering:['steering'],Brakes:['rotor','pad','brake'],Tires:['tire','rk003'],Body:['trunk']};
function hist(){const rows=[...car.history].reverse().filter(h=>!sel||h.work.some(w=>cats[sel].some(k=>w.toLowerCase().includes(k))));
document.getElementById('hist').innerHTML=rows.map(h=>`<tr><td class="d m">${h.date||'—'}</td><td class="m">${fmt(h.miles)}</td><td>${h.work.join(', ')}</td></tr>`).join('')||'<tr><td colspan=3>No jobs logged.</td></tr>'}
document.querySelectorAll('.box').forEach(b=>{const c=b.querySelector('.t').textContent;b.onclick=()=>{sel=sel===c?null:c;document.querySelectorAll('.box').forEach(x=>x.classList.toggle('sel',x.querySelector('.t').textContent===sel));hist()}});hist();
if(car.intervals.some(i=>!i.confirmed))document.getElementById('intflag').textContent='Intervals are placeholders until BJ confirms them (q74).';
});
</script></body></html>
