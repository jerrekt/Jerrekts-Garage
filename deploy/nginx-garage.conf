# Public page for Jerrekt's Garage. Listens on localhost only; cloudflared brings
# jerrekts-garage.adsuaracloud.com here. Static files from the repo checkout, and
# the bot's web paths proxied so the page stays same-origin (cookies, no CORS).
server {
    listen 127.0.0.1:8080;
    server_name jerrekts-garage.adsuaracloud.com;
    root /opt/garage-bot/src/public;
    index index.html;
    access_log off;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # the bot: public export, sign-in, and the signed-in API. Discord interactions
    # stay on the garage-api hostname and are not reachable through here.
    location ~ ^/(api/(public|me|act)|auth/(login|callback|logout))$ {
        proxy_pass http://127.0.0.1:8703;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_hide_header Access-Control-Allow-Origin;
        client_max_body_size 16k;
    }
    location /api/ { return 404; }
    location /auth/ { return 404; }
    location /discord/ { return 404; }
    location ~ /\. { return 404; }
    location ~* \.woff2$ { expires 30d; }
    location ~* \.(css|js)$ { expires 1h; }
    location / { try_files $uri $uri/ =404; }
}
