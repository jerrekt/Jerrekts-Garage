# Public page for Jerrekt's Garage. Listens on localhost only; cloudflared brings
# jerrekts-garage.adsuaracloud.com here. Static files from the repo checkout, and
# the one public API path proxied to the bot so the page stays same-origin.
server {
    listen 127.0.0.1:8080;
    server_name jerrekts-garage.adsuaracloud.com;
    root /opt/garage-bot/src/public;
    index index.html;
    access_log off;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /api/public {
        proxy_pass http://127.0.0.1:8703/api/public;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Access-Control-Allow-Origin;
    }
    location /api/ { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(woff2|css|js)$ { expires 7d; }
    location / { try_files $uri $uri/ =404; }
}
