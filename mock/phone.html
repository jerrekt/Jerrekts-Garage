<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jerrekt's Garage</title>
<style>
@font-face{font-family:Archivo;src:url(fonts/archivo-latin-wdth-normal.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:Caveat;src:url(fonts/caveat-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--bg:#0e0e0f;--card:#17171a;--card2:#1f1f23;--line:#2a2a2e;--text:#ece9e2;--muted:#9a968d;--gold:#c9a24a;--neon:#fffbd0;--n1:#fff38a;--n2:#ffe94d;--n3:#f5d000;--n4:rgba(245,208,0,.55);--over:#e06a5a;--soon:#e0a640;--ok:#6fbf8f;--unk:#8a8780;--disc:#5865f2;--tab:64px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom))}
a{color:var(--gold)}button{font:inherit}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
/* compact neon header */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.logo{font-family:Caveat,cursive;font-weight:700;font-size:34px;line-height:.95;color:var(--neon);display:inline-flex;align-items:flex-start;text-shadow:0 0 3px var(--n1),0 0 10px var(--n2),0 0 22px var(--n3),0 0 40px var(--n4)}
.crown{width:.5em;height:.5em;margin:.12em 0 0 .02em;transform:rotate(40deg);fill:none;stroke:var(--neon);stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 2px var(--n1)) drop-shadow(0 0 8px var(--n3))}
.word{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:8px;align-self:center}
.logo.f1{animation:flick 2.2s ease-out 1}@keyframes flick{0%,8%,14%,22%{opacity:.25}4%,11%,18%,30%,100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.logo{animation:none!important}}
/* car strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 4px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.strip button{all:unset;flex:0 0 auto;border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:96px;position:relative;cursor:pointer}
.strip button b{display:block;font-size:22px;font-weight:800;font-stretch:70%;line-height:1}
.strip button span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.strip button i{position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--unk)}
.strip button i.over{background:var(--over);box-shadow:0 0 8px var(--over)}.strip button i.ok{background:var(--ok)}.strip button i.soon{background:var(--soon)}
.strip button[aria-pressed=true]{border-color:var(--gold);background:var(--card2)}.strip button[aria-pressed=true] b{color:var(--neon);text-shadow:0 0 6px var(--n2),0 0 14px var(--n4)}
.strip .friend{opacity:.7}
main{padding:10px 16px 28px}
.view{display:none}.view.on{display:block}
h2{font-size:20px;font-weight:800;font-stretch:75%;margin:14px 0 8px}
.small{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.drum{display:inline-flex;gap:2px;background:#2a2f35;padding:4px;border-radius:5px;vertical-align:middle}
.drum span{width:24px;height:34px;display:grid;place-items:center;background:linear-gradient(#0d0f11,#25292d 50%,#0d0f11);color:#f2f2f2;font-weight:700;font-size:24px;font-stretch:75%;border-radius:2px}
.drum span.u{width:auto;padding:0 6px;font-size:12px;color:#9aa1a9;background:none}
.row{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-height:48px}
.row:first-child{border-top:0}
.row .bar{align-self:stretch;border-radius:2px}.row.over .bar{background:var(--over)}.row.soon .bar{background:var(--soon)}.row.ok .bar{background:var(--ok)}.row.unk .bar{background:repeating-linear-gradient(45deg,var(--unk) 0 3px,transparent 3px 6px)}
.row b{font-weight:600;display:block}.row .s{font-size:13px;color:var(--muted)}
.st{font-weight:700;font-size:13px;white-space:nowrap}.over .st{color:var(--over)}.soon .st{color:var(--soon)}.ok .st{color:var(--ok)}.unk .st{color:var(--unk)}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border:0;border-radius:14px;font-weight:700;font-size:17px;cursor:pointer}
.big.disc{background:var(--disc);color:#fff}.big.gold{background:var(--gold);color:#1a1405}.big.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.big svg{width:20px;height:20px;fill:currentColor}
.stack{display:grid;gap:10px}
.cmd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#0a0a0b;border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:#d8d4c8;display:block;white-space:pre-wrap;word-break:break-word}
/* log sheet */
.field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;font:inherit;font-size:17px;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:15px}
.seg button[aria-pressed=true]{border-color:var(--gold);background:var(--card2);color:var(--neon)}
.parts label{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}.parts label:first-child{border-top:0}
.parts input{width:20px;height:20px;accent-color:var(--gold)}
/* cars view */
.carcard{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.carcard b{font-size:24px;font-weight:800;font-stretch:70%}
.lock{font-size:12px;color:var(--muted)}
/* desktop-only notice */
.desk{display:flex;gap:12px;align-items:center;border:1px dashed var(--line);border-radius:14px;padding:12px 14px}
.desk svg{width:28px;height:28px;flex:0 0 auto;stroke:var(--muted);fill:none;stroke-width:1.6}
/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#121214;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:12px}
nav.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--neon)}
nav.tabs a .badge{position:absolute;margin:-26px 0 0 26px;background:var(--over);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:0 6px}
@media(min-width:700px){body{max-width:430px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}nav.tabs{max-width:430px;margin:0 auto}}
</style>
</head>
<body>
<div class="top"><div><span class="logo" id="logo">Jerrekt&rsquo;s<svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 19 L4 7.5 L9 12.5 L12 5 L15 12.5 L20 7.5 L21.5 19 Z"/></svg></span><span class="word">Garage</span></div><span class="small" id="mode">Private</span></div>
<div class="strip" id="strip"></div>
<main>
  <section class="view" id="v-due"></section>
  <section class="view" id="v-log"></section>
  <section class="view" id="v-cars"></section>
  <section class="view" id="v-parts"></section>
</main>
<nav class="tabs" aria-label="Sections">
  <a href="#due"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7v5l3 2"/><path d="M19 3l2 2-4 4"/></svg>Due<span class="badge" id="badge"></span></a>
  <a href="#log"><svg viewBox="0 0 24 24"><path d="M14.5 4.5l5 5L8 21H3v-5z"/><path d="M12 7l5 5"/></svg>Log</a>
  <a href="#cars"><svg viewBox="0 0 24 24"><path d="M3 13l2-5a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 5v5H3z"/><circle cx="7.5" cy="16" r="1.5"/><circle cx="16.5" cy="16" r="1.5"/></svg>Cars</a>
  <a href="#parts"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.1-2.1z"/></svg>Parts</a>
</nav>
<script src="data.js"></script>
<script src="data-e90.js"></script>
<script>
const G=window.GARAGE,TODAY=new Date(G.today),MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const k=m=>m==null?null:(m/1000).toFixed(1).replace(/\.0$/,'')+'k';
const pd=s=>{if(!s)return null;const p=s.split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)};
const fd=s=>{if(!s)return 'no date';const p=s.split('-').map(Number);return p[2]?`${MON[p[1]-1]} ${p[2]}, ${p[0]}`:p[1]?`${MON[p[1]-1]} ${p[0]}`:`${p[0]}`};
const addM=(x,m)=>{const y=new Date(x);y.setMonth(y.getMonth()+m);return y};
const E90=Object.assign({},window.GARAGE_E90,{plans:G.plans});
const CARS=[{id:'e36',chassis:'E36',model:'M3',data:G},{id:'e90',chassis:'E90',model:'328i',data:E90},{id:'f30',chassis:'F30',model:'328i',data:null},{id:'4r',chassis:'4Runner',model:'Toyota',data:null}];
const FRIENDS=[{chassis:'Example',model:"friend's car"}];
let sel=(()=>{try{return localStorage.getItem('garage-car')||'e36'}catch(e){return 'e36'}})();
function due(D){if(!D)return[];const jobs=D.visits.flatMap(v=>v.jobs.map(([name])=>({name,date:v.date,miles:v.miles})));
 const last=m=>{const h=jobs.filter(j=>m.some(w=>j.name.toLowerCase().includes(w)));return h.length?h.reduce((a,b)=>((b.miles||0)>=(a.miles||0)?b:a)):null};
 return D.plans.map(p=>{const l=last(p.match);if(!l)return{p,st:'unk',lab:'No record',txt:'Never logged'};let w=1,parts=[];
  if(p.miles&&l.miles){const left=l.miles+p.miles-D.odometer.miles;w=Math.min(w,left/p.miles);parts.push(left<0?`${k(-left)} mi over`:`${k(left)} mi left`)}
  const ld=pd(l.date);if(p.months&&ld){const dd=addM(ld,p.months),days=(dd-TODAY)/864e5;w=Math.min(w,days/(p.months*30.4));parts.push(days<0?`${Math.round(-days/30.4)} mo over`:`by ${MON[dd.getMonth()]} ${dd.getFullYear()}`)}
  const st=w<0?'over':w<.15?'soon':'ok';if(st==='over')parts.sort((a,b)=>(b.includes('over')?1:0)-(a.includes('over')?1:0));
  return{p,st,lab:{over:'Overdue',soon:'Due soon',ok:'OK'}[st],txt:parts.join(', ')}}).sort((a,b)=>({over:0,soon:1,unk:2,ok:3}[a.st]-{over:0,soon:1,unk:2,ok:3}[b.st]))}
const worst=D=>{const r=due(D);return r.some(x=>x.st==='over')?'over':r.some(x=>x.st==='soon')?'soon':r.length?'ok':'unk'};
const DISC=`<svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.4a18 18 0 0 1 4.4 2.2 15.6 15.6 0 0 0-15.2 0A18 18 0 0 1 8.8 3.4L8.6 3a19.8 19.8 0 0 0-4.9 1.4C.6 9 .1 13.5.3 17.9a19.9 19.9 0 0 0 6 3l1.3-2a12.3 12.3 0 0 1-2-1l.5-.4a14.1 14.1 0 0 0 11.8 0l.5.4-2 1 1.3 2a19.9 19.9 0 0 0 6-3c.3-5-.9-9.4-3.4-13.5ZM8.4 15.2c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Zm7.2 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Z"/></svg>`;
const DESK=`<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>`;
function render(){
 const c=CARS.find(x=>x.id===sel),D=c.data,all=due(D),over=all.filter(x=>x.st==='over').length;
 document.getElementById('strip').innerHTML=CARS.map(x=>`<button aria-pressed="${x.id===sel}" data-id="${x.id}"><i class="${worst(x.data)}"></i><b>${x.chassis}</b><span>${x.model}</span></button>`).join('')+`<button class="friend" disabled><i></i><b>🔒</b><span>Friends (${FRIENDS.length})</span></button>`;
 document.querySelectorAll('#strip [data-id]').forEach(b=>b.onclick=()=>{sel=b.dataset.id;try{localStorage.setItem('garage-car',sel)}catch(e){};render()});
 const badge=document.getElementById('badge');badge.textContent=over||'';badge.style.display=over?'':'none';
 // DUE
 document.getElementById('v-due').innerHTML=D?`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="drum num">${String(D.odometer.miles).padStart(6,'0').split('').map(x=>`<span>${x}</span>`).join('')}<span class="u">mi</span></span><a href="#log" class="small">${D.odometer.asOf?'as of '+fd(D.odometer.asOf):'date unknown'} · update</a></div></div>
  <h2>${over?over+' overdue':'Nothing overdue'} on the ${c.chassis}</h2>
  <div class="card" style="padding:0 14px">${all.filter(x=>x.st!=='unk').map(x=>`<div class="row ${x.st}"><div class="bar"></div><div><b>${x.p.job}</b><span class="s">${x.txt}</span></div><span class="st">${x.lab}</span></div>`).join('')}${(u=>u.length?`<div class="row unk"><div class="bar"></div><div><b>Never logged</b><span class="s">${u.map(x=>x.p.job).join(', ')}</span></div><span class="st">${u.length}</span></div>`:'')(all.filter(x=>x.st==='unk'))}</div>
  <p class="small" style="margin:8px 2px 14px;color:var(--soon)">Intervals are placeholders until you set your own.</p>
  <div class="stack"><a class="big disc" href="#log">${DISC} Log work</a></div>`
 :`<div class="card"><h2 style="margin-top:0">${c.chassis} ${c.model}</h2><p class="small">Nothing logged yet. Start with the mileage:</p><code class="cmd" style="margin:10px 0">/garage odo car:${c.id} miles:&lt;reading&gt;</code><a class="big disc" href="#log">${DISC} Log the first entry</a></div>`;
 // LOG
 const jobs=G.jobs;
 document.getElementById('v-log').innerHTML=`<h2 style="margin-top:4px">Log work · ${c.chassis}</h2><div class="card">
  <div class="field"><label>Job</label><select id="lj">${jobs.map(j=>`<option value="${j.id}">${j.name}</option>`).join('')}<option value="other">Something else</option></select></div>
  <div class="field"><label>Odometer</label><input inputmode="numeric" placeholder="${D?'Last: '+D.odometer.miles.toLocaleString():'First reading'}"></div>
  <div class="field"><label>Type</label><div class="seg"><button aria-pressed="true">Preventive</button><button>Corrective</button><button>Diagnostic</button><button>Upgrade</button></div></div>
  <div class="field" id="lparts"></div>
  <div class="stack"><button class="big gold" type="button">Save</button><button class="big ghost" type="button">${DISC} Send as Discord command instead</button></div>
  <p class="small" style="margin-top:10px">Either way it goes through the garage bot. Photos, cost and notes can be added after.</p></div>`;
 const lj=document.getElementById('lj');const lp=()=>{const j=jobs.find(x=>x.id===lj.value);document.getElementById('lparts').innerHTML=j&&j.kit?`<label>Parts installed (FCP, lifetime)</label><div class="parts card" style="padding:0 12px">${j.parts.map(p=>`<label><input type="checkbox" checked>${p.name}${p.qty>1?' ×'+p.qty:''}</label>`).join('')}</div>`:''};lj.onchange=lp;lp();
 document.querySelectorAll('#log .seg button').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
 // CARS
 document.getElementById('v-cars').innerHTML=`<h2 style="margin-top:4px">My cars</h2><div class="stack">${CARS.map(x=>{const w=worst(x.data);return`<div class="card carcard"><div><b>${x.chassis} <span style="font-weight:400;font-size:15px">${x.model}</span></b><div class="small">${x.data?k(x.data.odometer.miles)+' mi · '+due(x.data).filter(r=>r.st==='over').length+' overdue':'No history yet'}</div></div><span class="st ${w}" style="color:var(--${w})">${{over:'Overdue',soon:'Due soon',ok:'OK',unk:'Empty'}[w]}</span></div>`}).join('')}</div>
  <h2>Friends' cars</h2><div class="stack">${FRIENDS.map(f=>`<div class="card carcard"><div><b>${f.chassis} <span style="font-weight:400;font-size:15px">${f.model}</span></b><div class="small">Owner logs it through Discord</div></div><span class="lock">🔒 private</span></div>`).join('')}<button class="big ghost" type="button">+ Add a friend's car</button></div>
  <p class="small" style="margin-top:10px">A friend runs <code>/garage addcar</code> once, then <code>/garage log</code> for their own car. Only they and you see it.</p>`;
 // PARTS (summary on phone; tables on desktop)
 const j=jobs[0];
 document.getElementById('v-parts').innerHTML=`<h2 style="margin-top:4px">Parts on the phone</h2><div class="card"><b>${j.name}</b><div class="small">FCP kit ${j.kit.sku} · $${j.kit.price.toFixed(2)} · ${j.parts.length} parts, lifetime</div><div class="stack" style="margin-top:12px"><a class="big gold" href="${j.kit.url}" target="_blank" rel="noopener">Open kit on FCP</a><button class="big ghost" type="button">Copy the 4 part numbers</button></div></div>
  <div class="desk" style="margin-top:12px">${DESK}<div class="small">Full parts tables, RealOEM checks, history and repair stories are on the desktop view. The phone keeps it to logging and what's due.</div></div>
  <code class="cmd" style="margin-top:12px">/garage parts job:valve-cover</code><p class="small" style="margin-top:6px">Same list from Discord, with the links.</p>`;
}
render();
function route(){const h=(location.hash||'#due').slice(1);document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+h));document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h));window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.getElementById('logo').classList.add('f1');
</script>
</body>
</html>
